[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crpf-tender-backend"
version = "0.1.0"
description = "AI-Based Tender Evaluation & Eligibility Analysis Platform for CRPF Procurement - Backend API"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
]
